---
layout: default
---

<article class="article-page">

  <div class="container article-container">

    <div class="article-header">

      <div class="article-category">
        Browser Games
      </div>

      <h1>{{ page.title }}</h1>

      <div class="article-meta">

        <span>
          {{ page.date | date: "%B %d, %Y" }}
        </span>

        <span>•</span>

        <span>
          By Browser Games
        </span>

      </div>

    </div>

    <div class="article-content">

      {{ content }}

    </div>

  </div>

</article>
